name: Build Android APK & Google Play AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña Actions de GitHub

jobs:
  build:
    name: Compilar APK (Pruebas) y AAB (Google Play)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Instalar dependencias web
        run: npm install

      - name: Compilar aplicacion web (PWA + React)
        run: npm run build

      - name: Sincronizar proyecto Android con Capacitor
        run: npx cap sync android

      - name: Permisos de ejecucion para Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de depuracion (Para probar en el movil)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Compilar AAB (Android App Bundle para Google Play)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Subir APK de prueba como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: titivillus-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Subir AAB de Google Play como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: titivillus-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
